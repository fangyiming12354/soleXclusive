<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sneakers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{./css/styles_users.css}">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Zapatillas</h2>
    <a th:href="@{/sneakers/new}" class="btn btn-primary mb-2">Añadir zapatillas</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Marca</th>
            <th>Imagen</th>
            <th>Acciones</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="sneaker : ${sneakers}">
            <td th:text="${sneaker.id_sneaker}"></td>
            <td th:text="${sneaker.name}"></td>
            <td th:text="${sneaker.description}"></td>
            <td th:text="${sneaker.id_brand.name}"></td>
            <td>
                <img th:src="@{/images/{img}(img=${sneaker.filePath}" width="40">
            </td>
            <td>
                <a th:if="${user.type_user != 'admin'}" th:href="@{/users/edit/{id}(id=${user.id_user})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:if="${user.type_user != 'admin'}" th:href="@{/users/delete/{id}(id=${user.id_user})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
