<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{./css/styles_users.css}">
</head>
<body>
        <div class="container mt-4">
            <h2>Listado de Usuarios</h2>
            <a th:href="@{/users/new}" class="btn btn-primary mb-2">Alta Cliente</a>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo electrónico</th>
                    <th>Contraseña</th>
                    <th>Rol</th>
                    <th>Acciones</th>

                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id_user}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.type_user == 'admin' ? user.password : '******'}"></td>
                    <td th:text="${user.type_user}"></td>
                    <td>
                        <a th:if="${user.type_user != 'admin'}" th:href="@{/users/edit/{id}(id=${user.id_user})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:if="${user.type_user != 'admin'}" th:href="@{/users/delete/{id}(id=${user.id_user})}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
</body>
</html>
