<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${user.id_user == 0} ? 'Alta Usuario' : 'Editar Usuario'"></h2>

    <form th:action="${user.id_user == 0} ? @{/users/save} : @{/users/update}"
          th:object="${user}"
          method="post">

        <input type="hidden" th:field="*{id_user}"/>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{name}" required />
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" required />
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" required />
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/users" class="btn btn-secondary">Cancelar</a>

    </form>
</div>
</body>
</html>
