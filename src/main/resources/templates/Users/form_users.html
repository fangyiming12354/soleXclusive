<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario - Admin | SoleXclusive</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles_admin_forms.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}">
            <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo" class="nav_brand">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/users}"><i class="bi bi-people"></i> Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home/logout}"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<main class="form-container">

    <!-- ENCABEZADO -->
    <div class="form-header">
        <h1 th:text="${user.id_user == 0 or user.id_user == null} ? '✚ Nuevo Usuario' : '✎ Editar Usuario'"></h1>
        <p th:text="${user.id_user == 0 or user.id_user == null} ? 'Rellena los datos para crear un nuevo usuario' : 'Modifica los datos del usuario'"></p>
    </div>

    <!-- TARJETA DEL FORMULARIO -->
    <div class="form-card">
        <div class="form-card-header">
            <i class="bi bi-people"></i>
            <h5>Datos del Usuario</h5>
        </div>
        <div class="form-card-body">

            <form th:action="${user.id_user == 0 or user.id_user == null} ? @{/users/save} : @{/users/update}"
                  th:object="${user}"
                  method="post">

                <input type="hidden" th:field="*{id_user}"/>

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{name}"
                           placeholder="Ej: Juan Pérez" required />
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           placeholder="Ej: usuario@example.com" required />
                </div>

                <!-- CONTRASEÑA -->
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}"
                           placeholder="Mínimo 6 caracteres" required />
                </div>

                <!-- BOTONES -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-warning fw-bold text-dark">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>
                    <a th:href="@{/users}" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
