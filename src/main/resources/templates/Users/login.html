<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SoleXclusive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles_login.css}">
</head>
<body>

<main class="login">

  <!-- LOGO -->
  <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo">

  <!-- TÍTULO -->
  <h2>Bienvenido a SoleXclusive</h2>
  <p>Inicia sesión para continuar</p>

  <!-- FORMULARIO -->
  <form th:action="@{/login}" th:object="${user}" method="post">

    <!-- EMAIL -->
    <div class="mb-3">
      <label for="email" class="form-label"><i class="bi bi-envelope"></i> Correo Electrónico</label>
      <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="tu@email.com" required />
    </div>

    <!-- CONTRASEÑA -->
    <div class="mb-3">
      <label for="password" class="form-label"><i class="bi bi-lock"></i> Contraseña</label>
      <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Tu contraseña" required />
    </div>

    <!-- BOTÓN LOGIN -->
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
    </button>

  </form>

  <!-- MENSAJE DE ERROR -->
  <div th:if="${error}" th:text="${error}" role="alert" style="color: red;"></div>

  <!-- BOTÓN CREAR CUENTA -->
  <a th:href="@{/home/create-account}" class="btn btn-register">
    <i class="bi bi-person-plus"></i> Crear Cuenta
  </a>

  <!-- PIE DE PÁGINA -->
  <p class="welcome-text">
    <i class="bi bi-shield-check"></i> Tu compra está segura con nosotros
  </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
