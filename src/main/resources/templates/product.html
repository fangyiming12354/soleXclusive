<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${sneaker.name}">Detalle Sneaker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">
            <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo" class="nav_brand">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}"><i class="bi bi-house"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home/cart}"><i class="bi bi-bag"></i> Carrito</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home/profile}"><i class="bi bi-person"></i> Perfil</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENEDOR PRINCIPAL -->
<div class="container-product">

    <!-- MENSAJES DE ALERTA -->
    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <i class="bi bi-exclamation-circle"></i>
        <strong>Stock Insuficiente:</strong>
        <span th:if="${param.error == 'stock'}">
        La cantidad solicitada supera el stock disponible.
    </span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
        <i class="bi bi-check-circle"></i>
        <strong>Éxito:</strong> Producto agregado al carrito
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- PRODUCTO -->
    <div class="product-page">

        <!-- IZQUIERDA: IMAGEN -->
        <div class="product-image-section">
            <div class="product-image-box">
                <img th:src="@{/images/{img}(img=${sneaker.filePath})}"
                     th:alt="${sneaker.name}" class="product-img">
            </div>
        </div>

        <!-- DERECHA: INFO -->
        <div class="product-info-section">

            <!-- MARCA -->
            <p class="product-brand">
                <i class="bi bi-tag"></i>
                <span th:text="${sneaker.id_brands.name}"></span>
            </p>

            <!-- NOMBRE -->
            <h1 class="product-title" th:text="${sneaker.name}"></h1>

            <!-- TIPO -->
            <p class="product-type">
                <span th:text="${sneaker.id_type_sneakers.name}"></span>
            </p>

            <!-- PRECIO -->
            <div class="price-section">
                <div class="price-box">
                    <p class="price-label">Precio</p>
                    <h2 class="price" th:text="'€' + ${#numbers.formatDecimal(sneaker.price, 1, 2)}"></h2>
                </div>
            </div>

            <!-- FORMULARIO CARRITO -->
            <form th:action="@{/home/cart/add}" method="post" class="cart-form">

                <!-- SELECT TALLA -->
                <div class="form-group">
                    <label for="size" class="form-label">
                        <i class="bi bi-ruler"></i> Selecciona tu Talla
                    </label>
                    <select id="size" name="size" class="form-control size-select" required>
                        <option value="">-- Selecciona una talla --</option>
                        <option th:each="stock : ${stocks}"
                                th:if="${stock.id_sneaker.id_sneaker == sneaker.id_sneaker}"
                                th:value="${stock.size}"
                                th:text="${stock.size}">
                        </option>
                    </select>
                </div>

                <!-- CANTIDAD -->
                <div class="form-group">
                    <label for="quantity" class="form-label">
                        <i class="bi bi-box"></i> Cantidad
                    </label>
                    <input type="number" id="quantity" name="quantity" class="form-control"
                           value="1" min="1" max="10" required>
                </div>

                <!-- CAMPO OCULTO -->
                <input type="hidden" name="id_sneaker" th:value="${sneaker.id_sneaker}">

                <!-- BOTÓN AGREGAR -->
                <button type="submit" class="btn btn-add-cart">
                    <i class="bi bi-bag-plus"></i> Agregar al Carrito
                </button>

            </form>

            <!-- INFO ADICIONAL -->
            <div class="product-extra-info">
                <div class="info-item">
                    <i class="bi bi-truck"></i>
                    <p>Envío rápido</p>
                </div>
                <div class="info-item">
                    <i class="bi bi-shield-check"></i>
                    <p>Compra segura</p>
                </div>
                <div class="info-item">
                    <i class="bi bi-arrow-counterclockwise"></i>
                    <p>Devolución fácil</p>
                </div>
            </div>

        </div>

    </div>

    <!-- PRODUCTOS RELACIONADOS -->
    <div class="related-section">
        <h2 class="section-title">Productos Relacionados</h2>
        <div class="related-products">
            <div class="related-card" th:each="s : ${related}">
                <div class="related-image">
                    <img th:src="@{/img/img_sneakers/{img}(img=${s.filePath})}"
                         th:alt="${s.name}">
                </div>
                <div class="related-info">
                    <p class="related-name" th:text="${s.name}"></p>
                    <p class="related-price" th:text="'€' + ${#numbers.formatDecimal(s.price, 1, 2)}"></p>
                    <a th:href="@{/home/sneakers/{id}(id=${s.id_sneaker})}" class="btn-related">
                        Ver Producto
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
