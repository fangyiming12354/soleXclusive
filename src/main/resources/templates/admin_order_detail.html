<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Pedido - Admin | SoleXclusive</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles_admin_tables.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}">
            <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo" class="nav_brand">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/orders}"><i class="bi bi-receipt-cutoff"></i> Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home/logout}"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<main class="table-container">

    <div class="table-header">
        <h1><i class="bi bi-receipt"></i> Pedido #<span th:text="${order.id_order}"></span></h1>
        <p>Cliente: <span th:text="${order.id_user.name}"></span> &mdash;
            <span th:text="${#temporals.format(order.date, 'dd/MM/yyyy HH:mm')}"></span>
        </p>
    </div>

    <!-- TABLA DE ITEMS -->
    <div class="table-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Talla</th>
                <th>Cantidad</th>
                <th>Precio Ud.</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.id_sneaker.name}"></td>
                <td th:text="${item.size}"></td>
                <td th:text="${item.quantity}"></td>
                <td class="price-cell" th:text="'€' + ${#numbers.formatDecimal(item.unit_price, 1, 2)}"></td>
                <td class="price-cell" th:text="'€' + ${#numbers.formatDecimal(item.unit_price * item.quantity, 1, 2)}"></td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="4" style="text-align: right; font-weight: 700; color: #fff;">TOTAL</td>
                <td class="price-cell" style="font-size: 1.2rem; font-weight: 700;" th:text="'€' + ${#numbers.formatDecimal(order.total, 1, 2)}"></td>
            </tr>
            </tfoot>
        </table>
    </div>

    <!-- BOTÓN VOLVER -->
    <div class="text-center mt-4">
        <a th:href="@{/admin/orders}" class="btn-add-new">
            <i class="bi bi-arrow-left"></i> Volver a Pedidos
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
