<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link th:href="@{/css/styles_purchase_history.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/home">
      <img th:src="@{/img/logo_white_remove.png}" class="nav_brand" alt="Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/home/cart}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
              <path d="m23.918,4H4.49l-.256-1.843c-.17-1.229-1.234-2.157-2.476-2.157H0v1h1.759c.745,0,1.383.556,1.485,1.294l2.021,14.549c.17,1.229,1.234,2.157,2.476,2.157h12.259v-1H7.741c-.745,0-1.383-.556-1.485-1.294l-.237-1.706h15.699l2.2-11ZM5.88,14l-1.25-9h18.068l-1.8,9H5.88Zm1.12,6c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Zm10-3c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Z"/>
            </svg>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/home">INICIO</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/home/profile">MI PERFIL</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#">MIS COMPRAS</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/home/logout">CERRAR SESION</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container-history">

  <div class="history-header">
    <h1><i class="bi bi-bag-check"></i> Historial de Compras</h1>
    <p>Consulta todos tus pedidos realizados</p>
  </div>

  <!-- SI NO HAY COMPRAS -->
  <div th:if="${orders == null or orders.isEmpty()}">
    <div class="empty-history-container">
      <i class="bi bi-inbox"></i>
      <p>No tienes compras registradas</p>
      <a href="/home" class="btn btn-continue">
        <i class="bi bi-shop"></i> Comenzar a Comprar
      </a>
    </div>
  </div>

  <!-- SI HAY COMPRAS -->
  <div th:if="${orders != null and !orders.isEmpty()}">

    <!-- LISTA DE ORDENES -->
    <div class="orders-list">
      <div class="order-card" th:each="order : ${orders}">

        <!-- ENCABEZADO ORDEN -->
        <div class="order-header">
          <div class="order-info">
            <h5 class="order-id">Pedido #<span th:text="${order.id_order}"></span></h5>
            <p class="order-date">
              <i class="bi bi-calendar3"></i>
              <span th:text="${#temporals.format(order.date, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
          </div>
          <div class="order-amount">
            <p class="total" th:text="'€ ' + ${order.total}"></p>
          </div>
        </div>

        <!-- PRODUCTOS EN LA ORDEN -->
        <div class="order-preview">
          <h6><i class="bi bi-box"></i> Productos (<span th:text="${order.items.size()}"></span>)</h6>
          <div class="preview-items">
            <div class="preview-item" th:each="item : ${order.items}">
              <span class="item-name" th:text="${item.id_sneaker.name}"></span>
              <span class="item-qty">x<span th:text="${item.quantity}"></span></span>
            </div>
          </div>
        </div>

        <!-- BOTON VER DETALLES -->
        <div class="order-action">
          <a th:href="@{'/home/order-detail/' + ${order.id_order}}" class="btn btn-view-details">
            <i class="bi bi-eye"></i> Ver Detalles
          </a>
        </div>

      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
