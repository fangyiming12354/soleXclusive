<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link th:href="@{/css/styles_cart.css}" rel="stylesheet">
</head>
<body>

<div class="container">

  <!-- Encabezado -->
  <div class="cart-header">
    <h1><i class="bi bi-bag-heart"></i> Carrito de Compras</h1>
    <p>Revisa tus productos antes de pagar</p>
  </div>

  <!-- CARRITO VACÍO -->
  <th:block th:if="${cart == null || cart.items.isEmpty()}">
    <div class="empty-cart-container">
      <i class="bi bi-cart-x"></i>
      <p>Tu carrito está vacío</p>
      <a href="/home" class="btn btn-continue">
        <i class="bi bi-shop"></i> Continuar comprando
      </a>
    </div>
  </th:block>

  <!-- CARRITO CON PRODUCTOS -->
  <th:block th:unless="${cart == null || cart.items.isEmpty()}">

    <!-- Tabla de productos -->
    <div class="cart-table-wrapper">
      <table>
        <thead>
        <tr>
          <th><i class="bi bi-box"></i> Producto</th>
          <th>Talla</th>
          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
          <td th:text="${item.id_sneaker.name}"></td>
          <td th:text="${item.size}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="'€' + ${item.unit_price}"></td>
          <td th:text="'€' + ${item.quantity * item.unit_price}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Resumen de totales -->
    <div class="cart-summary">
      <div class="summary-card">
        <h6>Productos</h6>
        <div class="amount" th:text="${#lists.size(cart.items)}">0</div>
      </div>
      <div class="summary-card">
        <h6>Subtotal</h6>
        <div class="amount" th:text="'€' + ${total}">€0.00</div>
      </div>
    </div>

    <!-- Sección de total -->
    <div class="total-section">
      <h2>Total a Pagar</h2>
      <div class="total-amount" th:text="'€' + ${total}">€0.00</div>
    </div>

    <!-- Botones de acción -->
    <div class="cart-actions">
      <form th:action="@{/home/cart/checkout}" method="post">
        <button type="submit" class="btn btn-pay w-100">
          <i class="bi bi-credit-card"></i> Proceder al Pago
        </button>
      </form>
      <a href="/home" class="btn btn-secondary w-100">
        <i class="bi bi-arrow-left"></i> Continuar Comprando
      </a>
    </div>

  </th:block>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
