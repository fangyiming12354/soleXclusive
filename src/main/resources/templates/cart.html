<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras | SoleXclusive</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link th:href="@{/css/styles_cart.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/home}">
      <img th:src="@{/img/logo_white_remove.png}" class="nav_brand" alt="SoleXclusive Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/home/cart}" aria-label="Carrito de compras">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" aria-hidden="true">
              <path d="m23.918,4H4.49l-.256-1.843c-.17-1.229-1.234-2.157-2.476-2.157H0v1h1.759c.745,0,1.383.556,1.485,1.294l2.021,14.549c.17,1.229,1.234,2.157,2.476,2.157h12.259v-1H7.741c-.745,0-1.383-.556-1.485-1.294l-.237-1.706h15.699l2.2-11ZM5.88,14l-1.25-9h18.068l-1.8,9H5.88Zm1.12,6c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Zm10-3c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Z"/>
            </svg>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/home}">INICIO</a>
        </li>
        <li class="nav-item" th:if="${session.user != null}">
          <a class="nav-link user-name-nav" th:href="@{/home/profile}">
            <i class="bi bi-person-circle"></i>
            <span th:text="${session.user.name}"></span>
          </a>
        </li>
        <li class="nav-item" th:if="${session.user == null}">
          <a class="nav-link user-name-nav" th:href="@{/login}">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">

  <!-- Encabezado -->
  <div class="cart-header">
    <h1><i class="bi bi-bag-heart"></i> Carrito de Compras</h1>
    <p>Revisa tus productos antes de pagar</p>
  </div>

  <!-- CARRITO VACÍO -->
  <th:block th:if="${cart == null || cart.items.isEmpty()}">
    <div class="empty-cart-container">
      <i class="bi bi-cart-x"></i>
      <p>Tu carrito está vacío</p>
      <a th:href="@{/home}" class="btn btn-continue">
        <i class="bi bi-shop"></i> Continuar comprando
      </a>
    </div>
  </th:block>

  <!-- CARRITO CON PRODUCTOS -->
  <th:block th:unless="${cart == null || cart.items.isEmpty()}">

    <!-- Tabla de productos -->
    <div class="cart-table-wrapper">
      <table>
        <thead>
        <tr>
          <th><i class="bi bi-box"></i> Producto</th>
          <th>Talla</th>
          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
          <td th:text="${item.id_sneaker.name}"></td>
          <td th:text="${item.size}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="'€' + ${item.unit_price}"></td>
          <td th:text="'€' + ${item.quantity * item.unit_price}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Resumen de totales -->
    <div class="cart-summary">
      <div class="summary-card">
        <h6>Productos</h6>
        <div class="amount" th:text="${#lists.size(cart.items)}">0</div>
      </div>
      <div class="summary-card">
        <h6>Subtotal</h6>
        <div class="amount" th:text="'€' + ${total}">€0.00</div>
      </div>
    </div>

    <!-- Sección de total -->
    <div class="total-section">
      <h2>Total a Pagar</h2>
      <div class="total-amount" th:text="'€' + ${total}">€0.00</div>
    </div>

    <!-- Botones de acción -->
    <div class="cart-actions">
      <form th:action="@{/home/cart/checkout}" method="post">
        <button type="submit" class="btn btn-pay w-100">
          <i class="bi bi-credit-card"></i> Proceder al Pago
        </button>
      </form>
      <a th:href="@{/home}" class="btn btn-secondary w-100">
        <i class="bi bi-arrow-left"></i> Continuar Comprando
      </a>
    </div>

  </th:block>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
