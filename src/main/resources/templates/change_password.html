<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/css/styles_profile.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home">
            <img th:src="@{/img/logo_white_remove.png}" class="nav_brand" alt="SoleXclusive Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home/cart}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
                            <path d="m23.918,4H4.49l-.256-1.843c-.17-1.229-1.234-2.157-2.476-2.157H0v1h1.759c.745,0,1.383.556,1.485,1.294l2.021,14.549c.17,1.229,1.234,2.157,2.476,2.157h12.259v-1H7.741c-.745,0-1.383-.556-1.485-1.294l-.237-1.706h15.699l2.2-11ZM5.88,14l-1.25-9h18.068l-1.8,9H5.88Zm1.12,6c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Zm10-3c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Z"/>
                        </svg>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/home">INICIO</a>
                </li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link user-name-nav active" href="/home/profile">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${session.user.name}"></span>
                    </a>
                </li>
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="nav-link user-name-nav" href="/login">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-profile">

    <!-- Encabezado -->
    <div class="profile-header">
        <h1><i class="bi bi-lock"></i> Cambiar Contraseña</h1>
        <p>Actualiza tu contraseña de acceso</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card profile-card">
                <div class="card-header bg-gradient">
                    <i class="bi bi-shield-lock"></i> Nueva Contraseña
                </div>
                <div class="card-body">

                    <!-- Mensaje de éxito -->
                    <div th:if="${success}" class="alert-custom alert-success-custom mb-3">
                        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    </div>

                    <!-- Mensaje de error -->
                    <div th:if="${error}" class="alert-custom alert-error-custom mb-3">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/profile/change-password}" method="post">

                        <!-- CONTRASEÑA ACTUAL -->
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label-custom">Contraseña actual</label>
                            <input type="password" class="form-control-custom" id="currentPassword"
                                   name="currentPassword" placeholder="Tu contraseña actual" required/>
                        </div>

                        <!-- NUEVA CONTRASEÑA -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label-custom">Nueva contraseña</label>
                            <input type="password" class="form-control-custom" id="newPassword"
                                   name="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6"/>
                        </div>

                        <!-- CONFIRMAR CONTRASEÑA -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label-custom">Confirmar contraseña</label>
                            <input type="password" class="form-control-custom" id="confirmPassword"
                                   name="confirmPassword" placeholder="Repite la nueva contraseña" required minlength="6"/>
                        </div>

                        <!-- BOTONES -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-edit">
                                <i class="bi bi-check-circle"></i> Cambiar Contraseña
                            </button>
                            <a href="/home/profile" class="btn btn-secondary-custom">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
