<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="row">
    <div class="col-md-3 mb-4" th:each="sneaker : ${sneakers}">

        <div class="card sneaker-card h-100">

            <!-- Imagen -->
            <img th:src="@{/images/{img}(img=${sneaker.filePath})}"
                 class="card-img-top" alt="sneaker">

            <div class="card-body">

                <!-- Precio -->
                <h5 class="price" th:text="'€' + ${sneaker.price}"></h5>

                <!-- Nombre -->
                <p class="card-title" th:text="${sneaker.name}"></p>

                <!-- Botón -->
                <a href="#" class="btn btn-dark w-100">Buy Now</a>

            </div>
        </div>

    </div>
</div>
</body>
</html>
