<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home/cart}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
                            <path d="m23.918,4H4.49l-.256-1.843c-.17-1.229-1.234-2.157-2.476-2.157H0v1h1.759c.745,0,1.383.556,1.485,1.294l2.021,14.549c.17,1.229,1.234,2.157,2.476,2.157h12.259v-1H7.741c-.745,0-1.383-.556-1.485-1.294l-.237-1.706h15.699l2.2-11ZM5.88,14l-1.25-9h18.068l-1.8,9H5.88Zm1.12,6c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Zm10-3c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Z"/>
                        </svg>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">INICIO</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/home/profile">Area Personal</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
        <div class="carousel-item active">
            <div class="img-container">
                <img th:src="@{/img/home1.jpg}" class="d-block w-100" alt="Nike Air Force 1">
            </div>
        </div>
        <div class="carousel-item">
            <div class="img-container">
                <img th:src="@{/img/home2.jpg}" class="d-block w-100" alt="Adidas Samba">
            </div>
        </div>
        <div class="carousel-item">
            <div class="img-container">
                <img th:src="@{/img/home3.jpg}" class="d-block w-100" alt="Puma Lamelo Ball">
            </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>
<!-- Contenedor principal con filtros y productos -->
<div class="container-fluid mt-4">
    <div class="row">

        <!-- COLUMNA IZQUIERDA: FILTROS -->
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-funnel"></i> Filtros</h5>
                </div>
                <div class="card-body">

                    <!-- Formulario de filtros -->
                    <form th:action="@{/home/filter}" method="post">

                        <!-- Filtro por Marca -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Marca</label>
                            <select class="form-select form-select-sm" name="id_brand" id="brandSelect">
                                <option value="0" selected>Todas las marcas</option>
                                <option th:each="brand : ${brands}"
                                        th:value="${brand.id_brand}"
                                        th:text="${brand.name}">
                                </option>
                            </select>
                        </div>

                        <!-- Filtro por Tipo -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Tipo</label>
                            <select class="form-select form-select-sm" name="id_type_sneakers" id="typeSelect">
                                <option value="0" selected>Todos los tipos</option>
                                <option th:each="type : ${typeSneakers}"
                                        th:value="${type.id_type_sneakers}"
                                        th:text="${type.name}">
                                </option>
                            </select>
                        </div>

                        <!-- Botones -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark">
                                <i class="bi bi-search"></i> Filtrar
                            </button>
                            <a href="/home" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Limpiar
                            </a>
                        </div>
                    </form>


                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: PRODUCTOS -->
        <div class="col-md-9">

            <!-- Encabezado de resultados -->
            <div class="products-section">
                <h4>
                    <i class="bi bi-shop"></i> Nuestras Zapatillas
                </h4>
                <p>Mostrando <span th:text="${#lists.size(sneakers)}">0</span> productos</p>
            </div>

            <!-- Grid de productos -->
            <div class="row">
                <div class="col-md-4 mb-4" th:each="sneaker : ${sneakers}">
                    <div class="card sneaker-card h-100">
                        <!-- Imagen -->
                        <img th:src="@{/images/{img}(img=${sneaker.filePath})}"
                             class="card-img-top" alt="sneaker" style="height: 250px; object-fit: cover;">

                        <div class="card-body">
                            <!-- Marca y Tipo -->
                            <small class="text-muted" th:text="${sneaker.id_brands.name}"></small>
                            <small class="text-muted" th:text="' / ' + ${sneaker.id_type_sneakers.name}"></small>

                            <!-- Precio -->
                            <h5 class="price mt-2" th:text="'€' + ${sneaker.price}"></h5>

                            <!-- Nombre -->
                            <p class="card-title" th:text="${sneaker.name}"></p>

                            <!-- Botón -->
                            <a th:href="@{/home/sneakers/{id}(id=${sneaker.id_sneaker})}"
                               class="btn btn-dark w-100">Comprar</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mensaje si no hay productos -->
            <div th:if="${#lists.isEmpty(sneakers)}" class="alert alert-info">
                <i class="bi bi-info-circle"></i> No se encontraron productos con los filtros seleccionados.
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
