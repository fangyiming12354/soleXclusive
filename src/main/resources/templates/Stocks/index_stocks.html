<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - Admin | SoleXclusive</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles_admin_tables.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/admin}">
      <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo" class="nav_brand">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/stocks}"><i class="bi bi-box-seam"></i> Stock</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/home/logout}"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->
<main class="table-container">

  <!-- ENCABEZADO -->
  <div class="table-header">
    <h1><i class="bi bi-box-seam"></i> Inventario de Stock</h1>
    <p>Mostrando <span th:text="${#lists.size(stocks)}">0</span> registros de stock</p>
  </div>

  <div class="row">

    <!-- FILTRO LATERAL -->
    <div class="col-lg-3 mb-4">
      <div class="filter-card">
        <div class="filter-card-header">
          <i class="bi bi-funnel"></i>
          <h5>Filtros</h5>
        </div>
        <div class="filter-card-body">
          <form th:action="@{/stocks/filter}" method="get">

            <!-- Filtro por Marca -->
            <div class="filter-group">
              <label class="filter-label">Marca</label>
              <select class="filter-select" name="id_brand">
                <option value="0" selected>Todas las marcas</option>
                <option th:each="b : ${brands}"
                        th:value="${b.id_brand}"
                        th:text="${b.name}"></option>
              </select>
            </div>

            <!-- Filtro por Tipo -->
            <div class="filter-group">
              <label class="filter-label">Tipo</label>
              <select class="filter-select" name="id_type_sneakers">
                <option value="0" selected>Todos los tipos</option>
                <option th:each="t : ${typeSneakers}"
                        th:value="${t.id_type_sneakers}"
                        th:text="${t.name}"></option>
              </select>
            </div>

            <div class="filter-actions">
              <button type="submit" class="btn-filter"><i class="bi bi-search"></i> Filtrar</button>
              <a th:href="@{/stocks}" class="btn-clear"><i class="bi bi-x-circle"></i> Mostrar todos</a>
            </div>
          </form>
        </div>
      </div>

      <!-- BOTÓN AÑADIR -->
      <a th:href="@{/stocks/new}" class="btn-add-new mt-3 w-100 justify-content-center">
        <i class="bi bi-plus-circle"></i> Añadir Stock
      </a>
    </div>

    <!-- TABLA -->
    <div class="col-lg-9">
      <div class="table-card">
        <table class="admin-table">
          <thead>
          <tr>
            <th class="sortable" data-col="0">Zapatilla</th>
            <th>Imagen</th>
            <th class="sortable" data-col="2">Marca</th>
            <th class="sortable" data-col="3">Tipo</th>
            <th class="sortable" data-col="4">Talla</th>
            <th class="sortable" data-col="5">Cantidad</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="stock : ${stocks}">
            <td th:text="${stock.id_sneaker.name}"></td>
            <td>
              <img th:src="@{/img/img_sneakers/{img}(img=${stock.id_sneaker.filePath})}" th:alt="${stock.id_sneaker.name}">
            </td>
            <td th:text="${stock.id_sneaker.id_brands.name}"></td>
            <td th:text="${stock.id_sneaker.id_type_sneakers.name}"></td>
            <td th:text="${stock.size}"></td>
            <td>
                    <span th:class="${stock.quantity == 0} ? 'stock-out' : (${stock.quantity <= 5} ? 'stock-low' : 'stock-ok')"
                          th:text="${stock.quantity}"></span>
            </td>
            <td>
              <div class="table-actions">
                <a th:href="@{/stocks/edit/{id}(id=${stock.id_stock})}" class="btn-edit">
                  <i class="bi bi-pencil"></i> Editar
                </a>
                <a th:href="@{/stocks/delete/{id}(id=${stock.id_stock})}" class="btn-delete"
                   onclick="return confirm('¿Estás seguro de eliminar este stock?')">
                  <i class="bi bi-trash3"></i> Eliminar
                </a>
              </div>
            </td>
          </tr>
          <!-- TABLA VACÍA -->
          <tr th:if="${#lists.isEmpty(stocks)}">
            <td colspan="8">
              <div class="empty-table">
                <i class="bi bi-box-seam"></i>
                <p>No hay registros de stock</p>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sort_table.js}"></script>
<script th:src="@{/js/paginate_table.js}"></script>
</body>
</html>
