<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2>Listado de Usuarios</h2>
  <a th:href="@{/stocks/new}" class="btn btn-primary mb-2">Añadir Stocks</a>
  <table class="table table-bordered">
    <thead>
    <tr>
      <th>ID</th>
      <th>Nombre de la Zapatilla</th>
      <th>Foto de la Zapatilla</th>
      <th>Marca</th>
      <th>Tipo</th>
      <th>Talla</th>
      <th>Cantidad</th>
      <th>Acciones</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="stock : ${stocks}">
      <td th:text="${stock.id_stock}"></td>
      <td th:text="${stock.id_sneaker.name}"></td>
      <td>
        <img th:src="@{/images/{img}(img=${stock.id_sneaker.filePath})}" width="40">
      </td>
      <td th:text="${stock.id_sneaker.id_brands.name}"></td>
      <td th:text="${stock.id_sneaker.id_type_sneakers.name}"></td>
      <td th:text="${stock.size}"></td>
      <td th:text="${stock.quantity}"></td>
      <td>
        <a th:href="@{/stocks/edit/{id}(id=${stock.id_stock})}" class="btn btn-warning btn-sm">Editar</a>
        <a th:href="@{/stocks/delete/{id}(id=${stock.id_stock})}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
