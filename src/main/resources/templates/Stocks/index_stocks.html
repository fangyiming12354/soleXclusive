<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles_admin_tables.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/admin}">
      <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo" class="nav_brand">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/stocks}"><i class="bi bi-box-seam"></i> Stock</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/home/logout}"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->
<div class="table-container">

  <!-- ENCABEZADO -->
  <div class="table-header">
    <h1><i class="bi bi-box-seam"></i> Inventario de Stock</h1>
    <p>Mostrando <span th:text="${#lists.size(stocks)}">0</span> registros de stock</p>
  </div>

  <!-- BARRA DE ACCIONES -->
  <div class="actions-bar">
    <div></div>
    <a th:href="@{/stocks/new}" class="btn-add-new">
      <i class="bi bi-plus-circle"></i> Añadir Stock
    </a>
  </div>

  <!-- TABLA -->
  <div class="table-card">
    <table class="admin-table">
      <thead>
      <tr>
        <th>Zapatilla</th>
        <th>Imagen</th>
        <th>Marca</th>
        <th>Tipo</th>
        <th>Talla</th>
        <th>Cantidad</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="stock : ${stocks}">
        <td th:text="${stock.id_sneaker.name}"></td>
        <td>
          <img th:src="@{/img/img_sneakers/{img}(img=${stock.id_sneaker.filePath})}" alt="img">
        </td>
        <td th:text="${stock.id_sneaker.id_brands.name}"></td>
        <td th:text="${stock.id_sneaker.id_type_sneakers.name}"></td>
        <td th:text="${stock.size}"></td>
        <td>
                    <span th:class="${stock.quantity == 0} ? 'stock-out' : (${stock.quantity <= 5} ? 'stock-low' : 'stock-ok')"
                          th:text="${stock.quantity}"></span>
        </td>
        <td>
          <div class="table-actions">
            <a th:href="@{/stocks/edit/{id}(id=${stock.id_stock})}" class="btn-edit">
              <i class="bi bi-pencil"></i> Editar
            </a>
            <a th:href="@{/stocks/delete/{id}(id=${stock.id_stock})}" class="btn-delete"
               onclick="return confirm('¿Estás seguro de eliminar este stock?')">
              <i class="bi bi-trash3"></i> Eliminar
            </a>
          </div>
        </td>
      </tr>
      <!-- TABLA VACÍA -->
      <tr th:if="${#lists.isEmpty(stocks)}">
        <td colspan="8">
          <div class="empty-table">
            <i class="bi bi-box-seam"></i>
            <p>No hay registros de stock</p>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
