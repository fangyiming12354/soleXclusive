<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Sneakers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${stock.id_stock == 0} ? 'Añadir Sneaker' : 'Editar Sneaker'"></h2>

    <form th:action="${stock.id_stock == 0} ? @{/stocks/save} : @{/stocks/update}"
          th:object="${stock}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id_stock}"/>

        <div class="mb-3">
            <label class="form-label">Nombre de la zapatilla</label>
            <select class="form-control" th:field="*{id_sneaker.id_sneaker}">
                <option th:each="s : ${sneakers}"
                        th:value="${s.id_sneaker}"
                        th:text="${s.name}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Talla</label>
            <input type="number" step="0.5" class="form-control" th:field="*{size}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" step="1" class="form-control" th:field="*{quantity}" required />
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/sneakers" class="btn btn-secondary">Cancelar</a>

    </form>
</div>
</body>
</html>
