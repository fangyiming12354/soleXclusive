<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcas - Admin | SoleXclusive</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles_admin_tables.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}">
            <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo" class="nav_brand">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/brands}"><i class="bi bi-tags"></i> Marcas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home/logout}"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<main class="table-container">

    <!-- ENCABEZADO -->
    <div class="table-header">
        <h1><i class="bi bi-tags"></i> Listado de Marcas</h1>
        <p>Mostrando <span th:text="${#lists.size(brands)}">0</span> marcas registradas</p>
    </div>

    <!-- BARRA DE ACCIONES -->
    <div class="actions-bar">
        <div></div>
        <a th:href="@{/brands/new}" class="btn-add-new">
            <i class="bi bi-plus-circle"></i> Añadir Marca
        </a>
    </div>

    <!-- TABLA -->
    <div class="table-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th class="sortable" data-col="0">Nombre</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="brand : ${brands}">
                <td th:text="${brand.name}"></td>
                <td>
                    <div class="table-actions">
                        <a th:href="@{/brands/edit/{id}(id=${brand.id_brand})}" class="btn-edit">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/brands/delete/{id}(id=${brand.id_brand})}" class="btn-delete"
                           onclick="return confirm('¿Estás seguro de eliminar esta marca?')">
                            <i class="bi bi-trash"></i> Eliminar
                        </a>
                    </div>
                </td>
            </tr>
            <!-- TABLA VACÍA -->
            <tr th:if="${#lists.isEmpty(brands)}">
                <td colspan="3">
                    <div class="empty-table">
                        <i class="bi bi-tags"></i>
                        <p>No hay marcas registradas</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sort_table.js}"></script>
<script th:src="@{/js/paginate_table.js}"></script>
</body>
</html>
