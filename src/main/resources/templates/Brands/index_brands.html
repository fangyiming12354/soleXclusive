<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div class="container mt-4">
    <h2>Listado de Marcas</h2>
    <a th:href="@{/brands/new}" class="btn btn-primary mb-2">Añadir Marcas</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="brand : ${brands}">
            <td th:text="${brand.id_brand}"></td>
            <td th:text="${brand.name}"></td>
            <td>
                <a th:href="@{/brands/edit/{id}(id=${brand.id_brand})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/brands/delete/{id}(id=${brand.id_brand})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
