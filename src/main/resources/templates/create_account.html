<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | SoleXclusive</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles_create_account.css}">
</head>
<body>

<main class="login">

  <!-- LOGO -->
  <img th:src="@{/img/logo_white_remove.png}" alt="SoleXclusive Logo">

  <!-- TÍTULO -->
  <h2>Crear tu Cuenta</h2>
  <p>Únete a la comunidad SoleXclusive</p>

  <!-- FORMULARIO -->
  <form th:action="@{/home/create-account/save}" th:object="${user}" method="post">

    <!-- NOMBRE -->
    <div class="mb-3">
      <label for="name" class="form-label">
        <i class="bi bi-person"></i> Nombre Completo
      </label>
      <input type="text" class="form-control" id="name" th:field="*{name}"
             placeholder="Tu nombre completo" required />
    </div>

    <!-- EMAIL -->
    <div class="mb-3">
      <label for="email" class="form-label">
        <i class="bi bi-envelope"></i> Correo Electrónico
      </label>
      <input type="email" class="form-control" id="email" th:field="*{email}"
             placeholder="tu@email.com" required />
    </div>

    <!-- CONTRASEÑA -->
    <div class="mb-3">
      <label for="password" class="form-label">
        <i class="bi bi-lock"></i> Contraseña
      </label>
      <input type="password" class="form-control" id="password" th:field="*{password}"
             placeholder="Tu contraseña" required />
    </div>

    <!-- BOTÓN CREAR CUENTA -->
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-circle"></i> Crear Cuenta
    </button>

  </form>

  <!-- MENSAJE DE ERROR -->
  <div th:if="${error}" th:text="${error}" role="alert" style="color: red;"></div>

  <!-- PIE DE PÁGINA -->
  <p class="welcome-text">
    ¿Ya tienes cuenta? <a th:href="@{/login}" style="color: #ffb800; text-decoration: none;">Inicia sesión aquí</a>
  </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
