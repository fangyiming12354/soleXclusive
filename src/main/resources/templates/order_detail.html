<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link th:href="@{/css/styles_purchase_history.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/home">
      <img th:src="@{/img/logo_white_remove.png}" class="nav_brand" alt="Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/home/cart}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
              <path d="m23.918,4H4.49l-.256-1.843c-.17-1.229-1.234-2.157-2.476-2.157H0v1h1.759c.745,0,1.383.556,1.485,1.294l2.021,14.549c.17,1.229,1.234,2.157,2.476,2.157h12.259v-1H7.741c-.745,0-1.383-.556-1.485-1.294l-.237-1.706h15.699l2.2-11ZM5.88,14l-1.25-9h18.068l-1.8,9H5.88Zm1.12,6c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Zm10-3c-1.103,0-2,.897-2,2s.897,2,2,2,2-.897,2-2-.897-2-2-2Zm0,3c-.552,0-1-.449-1-1s.448-1,1-1,1,.449,1,1-.448,1-1,1Z"/>
            </svg>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/home">INICIO</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/home/profile">MI PERFIL</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/home/purchase-history">MIS COMPRAS</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/logout">CERRAR SESION</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->
<div class="container-history">

  <div class="detail-header">
    <a href="/home/purchase-history" class="btn btn-back">
      <i class="bi bi-arrow-left"></i> Volver
    </a>
    <h1><i class="bi bi-receipt"></i> Detalle del Pedido #<span th:text="${order.id_order}"></span></h1>
  </div>

  <div class="order-detail-card">

    <div class="detail-card-header">
      <p class="order-date">
        <i class="bi bi-calendar3"></i>
        <span th:text="${#temporals.format(order.date, 'dd/MM/yyyy HH:mm:ss')}"></span>
      </p>
    </div>

    <div class="detail-card-body">

      <!-- TABLA DE PRODUCTOS -->
      <div class="products-section">
        <h5><i class="bi bi-box2"></i> Productos</h5>

        <table class="table table-dark table-striped">
          <thead>
          <tr>
            <th>Producto</th>
            <th>Marca</th>
            <th>Talla</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${order.items}">
            <td th:text="${item.id_sneaker.name}"></td>
            <td th:text="${item.id_sneaker.id_brands.name}"></td>
            <td th:text="${item.size}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="'€ ' + ${item.unit_price}"></td>
            <td th:text="'€ ' + ${item.quantity * item.unit_price}"></td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- RESUMEN TOTAL -->
      <div class="costs-summary">
        <div class="cost-item total">
          <span><strong>TOTAL</strong></span>
          <span class="cost-value total-amount" th:text="'€ ' + ${order.total}"></span>
        </div>
      </div>

      <!-- BOTONES -->
      <div class="action-buttons mt-4">
        <a href="/home/purchase-history" class="btn btn-secondary w-100">
          <i class="bi bi-arrow-left"></i> Volver al Historial
        </a>
        <a href="/home" class="btn btn-primary w-100 mt-2">
           Volver al inicio
        </a>
      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
